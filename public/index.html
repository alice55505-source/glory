<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="manifest" href="manifest.webmanifest">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">

<meta name="mobile-web-app-capable" content="yes">

<style>
  :root {
    --bg: #f3f6fa; --card: #ffffff; --ink: #1f2522; --muted: #6b726e; --line: #e2e0d9;
    --accent: #1f5aa6; --accent-soft: #e3edf9; --ok: #2e7d4f; --ok-soft: #e2f3e8;
    --bad: #b3422f; --bad-soft: #f8e6e2; --warn: #a86f12; --warn-soft: #f8eed9;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #151816; --card: #1f2321; --ink: #e8ebe9; --muted: #9aa29d; --line: #2f3531;
      --accent: #8cc0f5; --accent-soft: #1d2c3d; --ok: #6fcf97; --ok-soft: #1e3327;
      --bad: #ef8b78; --bad-soft: #3a2420; --warn: #e3b25a; --warn-soft: #382d1a;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
    font-size: 16px; line-height: 1.5; padding-bottom: calc(76px + env(safe-area-inset-bottom)); }
  header { position: sticky; top: 0; z-index: 5; background: var(--accent); color: #fff; padding: 12px 16px; }
  @media (prefers-color-scheme: dark) { header { color: #0e1a2b; } }
  header h1 { margin: 0; font-size: 18px; }
  header .sub { font-size: 13px; opacity: .85; }
  main { max-width: 860px; margin: 0 auto; padding: 16px; }
  nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; display: flex; background: var(--card);
    border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
  body.noauth nav { display: none; }
  nav button { flex: 1; border: 0; background: none; color: var(--muted); padding: 8px 4px 10px; font-size: 12px; cursor: pointer; }
  nav button b { display: block; font-size: 15px; }
  nav button.on { color: var(--accent); font-weight: 700; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .card h3 { margin: 0 0 8px; font-size: 16px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .between { justify-content: space-between; }
  .muted { color: var(--muted); font-size: 13px; }
  .tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 99px; background: var(--accent-soft); color: var(--accent); white-space: nowrap; }
  .tag.req { background: var(--bad-soft); color: var(--bad); }
  .tag.opt { background: var(--line); color: var(--muted); }
  .tag.yr { background: var(--warn-soft); color: var(--warn); }
  .tag.ok { background: var(--ok-soft); color: var(--ok); }
  input, select, textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; max-width: 100%; }
  input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--accent); }
  label.f { display: block; margin-bottom: 10px; }
  label.f span { display: block; font-size: 13px; color: var(--muted); margin-bottom: 2px; }
  label.f input, label.f select { width: 100%; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
  button.btn { font: inherit; border: 1px solid var(--accent); background: var(--accent); color: #fff; border-radius: 8px; padding: 8px 14px; cursor: pointer; }
  @media (prefers-color-scheme: dark) { button.btn { color: #0e1a2b; } }
  button.btn.ghost { background: transparent; color: var(--accent); }
  button.btn.danger { background: transparent; border-color: var(--bad); color: var(--bad); }
  button.btn.sm { padding: 4px 10px; font-size: 14px; }
  button.btn:disabled { opacity: .5; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { font: inherit; border: 0; background: var(--card); color: var(--muted); padding: 6px 12px; cursor: pointer; }
  .seg button.on { background: var(--accent); color: #fff; }
  .list-item { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 10px 0; border-top: 1px solid var(--line); }
  .list-item:first-child { border-top: 0; }
  .church { width: 100%; text-align: left; font: inherit; color: var(--ink); background: none; border: 0; border-top: 1px solid var(--line); padding: 14px 4px; cursor: pointer; display: flex; justify-content: space-between; }
  .church:first-of-type { border-top: 0; }
  .church::after { content: '›'; color: var(--muted); }
  .att { border-top: 1px solid var(--line); padding: 10px 0; }
  .att:first-child { border-top: 0; }
  .att .name { font-weight: 700; }
  .checks { display: flex; flex-wrap: wrap; gap: 8px 14px; margin-top: 6px; }
  .checks label { display: inline-flex; align-items: center; gap: 6px; }
  .stepper { display: inline-flex; align-items: center; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .stepper button { font: inherit; width: 34px; height: 32px; border: 0; background: var(--bg); color: var(--ink); cursor: pointer; }
  .stepper span { min-width: 30px; text-align: center; }
  .hours { width: 72px; }
  .lessons { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; margin-top: 6px; }
  .lessons label { display: flex; align-items: center; gap: 6px; font-size: 14px; }
  .tbl-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { padding: 6px 6px; border-bottom: 1px solid var(--line); text-align: center; white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--card); }
  th { color: var(--muted); font-weight: 600; font-size: 12px; }
  .y { color: var(--ok); font-weight: 700; } .n { color: var(--bad); } .o { color: var(--muted); }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; text-align: center; }
  .stat b { display: block; font-size: 24px; }
  .empty { text-align: center; color: var(--muted); padding: 24px 0; }
  .err { color: var(--bad); font-size: 14px; min-height: 1.5em; }
  dialog { border: 0; border-radius: 14px; padding: 0; width: min(520px, calc(100vw - 32px)); background: var(--card); color: var(--ink); }
  dialog::backdrop { background: rgba(0,0,0,.4); }
  dialog form { padding: 16px; }
  dialog h3 { margin-top: 0; }
  .toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 99px; font-size: 14px; z-index: 20; }
  #preview img { width: 100%; border-radius: 8px; border: 1px solid var(--line); }
</style>
</head>
<body>
<header>
  <h1>得榮少年點名系統</h1>
  <div class="sub" id="hdrSub"></div>
</header>
<main id="app"></main>
<nav id="nav">
  <button data-tab="rules"><b>①</b>各地規定</button>
  <button data-tab="youth"><b>②</b>得少資料</button>
  <button data-tab="att"><b>③</b>點名</button>
  <button data-tab="stats"><b>④</b>統計</button>
</nav>
<dialog id="dlg"></dialog>

<script>
/* ============ 基本 ============ */
const GRADES = ['小五','小六','國一','國二','國三','高一','高二','高三','大專','其他'];
const uid = () => Math.random().toString(36).slice(2, 10);
const clone = v => v === undefined ? null : JSON.parse(JSON.stringify(v));
const lsGet = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

function defaultRules() {
  return [
    { id: 'lessons', builtin: true, enabled: true, name: '申請八堂課', period: 'once', kind: 'lessons', req: 'required', label: '八堂課',
      lessons: ['第一堂','第二堂','第三堂','第四堂','第五堂','第六堂','第七堂','第八堂'] },
    { id: 'home', builtin: true, enabled: true, name: '每月家訪', period: 'monthly', kind: 'check', req: 'required', label: '家訪' },
    { id: 'group', builtin: true, enabled: true, name: '每月聚集（小排或主日）', period: 'monthly', kind: 'gathering', req: 'optional', label: '小排', sundayFromYear: 3 },
    { id: 'sunday', builtin: true, enabled: true, name: '每月主日', period: 'monthly', kind: 'count', req: 'fromYear', fromYear: 3, target: 1, label: '主日' },
    { id: 'growth', builtin: true, enabled: true, name: '每年生命成長園', period: 'yearly', kind: 'hours', req: 'required', target: 8, label: '成長園' },
    { id: 'service', builtin: true, enabled: true, name: '每年社區服務', period: 'yearly', kind: 'hours', req: 'required', target: 4, label: '社區服務' },
  ];
}

/* ============ 登入與同步 ============ */
// S：本機記住的召會登入 {id, name, token}；登入一次後下次不用再登入
let S = lsGet('derong-session');
let DB = { rules: [], youths: {} };
let pending = [];          // 尚未被伺服器確認的修改
let ws = null, online = false, retry = 0, retryTimer = null;
const docKey = () => 'derong-doc-' + S.id;
const opsKey = () => 'derong-ops-' + S.id;

function applySet(doc, path, value) {
  let o = doc;
  for (const k of path.slice(0, -1)) {
    if (typeof o[k] !== 'object' || o[k] === null || Array.isArray(o[k])) o[k] = {};
    o = o[k];
  }
  const last = path[path.length - 1];
  if (value === null || value === undefined) delete o[last]; else o[last] = value;
}
function persistLocal() { lsSet(docKey(), DB); lsSet(opsKey(), pending); }

// 所有修改都經過這裡：先改本機、記在待上傳，再送到伺服器
function setPath(path, value) {
  const op = { id: uid(), path, value: clone(value) };
  applySet(DB, path, clone(value));
  pending.push(op);
  persistLocal();
  if (online) ws.send(JSON.stringify({ type: 'set', ...op }));
  updateHeader();
}

function connect() {
  clearTimeout(retryTimer);
  if (!S || (ws && ws.readyState <= 1)) return;
  const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
  ws = new WebSocket(`${proto}//${location.host}/api/churches/${S.id}/ws?token=${encodeURIComponent(S.token)}`);
  ws.onopen = () => { retry = 0; };
  ws.onmessage = e => {
    const msg = JSON.parse(e.data);
    if (msg.type === 'auth-error') { logout('登入已失效，請重新登入'); return; }
    if (msg.type === 'state') {
      online = true;
      DB = msg.doc || {};
      if (msg.name && msg.name !== S.name) { S.name = msg.name; lsSet('derong-session', S); }
      for (const op of pending) { applySet(DB, op.path, clone(op.value)); ws.send(JSON.stringify({ type: 'set', ...op })); }
      if (!Array.isArray(DB.rules)) setPath(['rules'], defaultRules());
      DB.youths ||= {};
      persistLocal(); scheduleRender();
    } else if (msg.type === 'ack') {
      pending = pending.filter(o => o.id !== msg.id);
      if (msg.error) toast(msg.error);
      persistLocal(); updateHeader();
    } else if (msg.type === 'set') {
      applySet(DB, msg.path, msg.value);
      for (const op of pending) applySet(DB, op.path, clone(op.value));
      persistLocal(); scheduleRender();
    }
  };
  ws.onclose = () => {
    online = false; updateHeader();
    if (S) retryTimer = setTimeout(connect, Math.min(30000, 1000 * 2 ** retry++));
  };
}
window.addEventListener('online', () => { retry = 0; connect(); });
document.addEventListener('visibilitychange', () => { if (!document.hidden) { retry = 0; connect(); } });

function startSession(sess) {
  S = sess; lsSet('derong-session', S);
  DB = lsGet(docKey()) || { rules: [], youths: {} };
  DB.youths ||= {}; DB.rules ||= [];
  pending = lsGet(opsKey()) || [];
  tab = 'att'; render(); connect();
}
function logout(msg) {
  if (S) { lsSet(docKey(), null); lsSet(opsKey(), null); }
  S = null; lsSet('derong-session', null); online = false; pending = [];
  if (ws) { ws.onclose = null; ws.close(); ws = null; }
  render(); if (msg) toast(msg);
}

async function api(path, body, token) {
  const res = await fetch('/api/churches' + path, {
    method: body ? 'POST' : 'GET',
    headers: { 'content-type': 'application/json', ...(token ? { authorization: 'Bearer ' + token } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || '連線失敗');
  return data;
}

/* ============ 工具 ============ */
const pad = n => String(n).padStart(2, '0');
const now = new Date();
const thisMonth = `${now.getFullYear()}-${pad(now.getMonth() + 1)}`;
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
const ymLabel = ym => { const [y, m] = ym.split('-'); return `${y}年${+m}月`; };
const shiftYm = (ym, d) => { let [y, m] = ym.split('-').map(Number); m += d; while (m < 1) { m += 12; y--; } while (m > 12) { m -= 12; y++; } return `${y}-${pad(m)}`; };

function age(bd) {
  if (!bd) return '';
  const b = new Date(bd); if (isNaN(b)) return '';
  let a = now.getFullYear() - b.getFullYear();
  if (now.getMonth() < b.getMonth() || (now.getMonth() === b.getMonth() && now.getDate() < b.getDate())) a--;
  return a;
}
// 第幾年：申請月起算，每 12 個月加一年；0 = 待申請
function yearN(y, ym) {
  if (!y.appYear) return 0;
  const [cy, cm] = ym.split('-').map(Number);
  const diff = (cy * 12 + cm) - (y.appYear * 12 + Number(y.appMonth));
  return diff < 0 ? 0 : Math.floor(diff / 12) + 1;
}
// 第 N 年的起訖月，例：2025/5–2026/4
function serviceRange(y, n) {
  const s = y.appYear * 12 + (Number(y.appMonth) - 1) + 12 * (n - 1), e = s + 11;
  const f = m => `${Math.floor(m / 12)}/${m % 12 + 1}`;
  return `${f(s)}–${f(e)}`;
}
// 待申請的得少只需完成八堂課；已申請者依規定
function isRequired(rule, y, ym) {
  const n = yearN(y, ym);
  if (!n) return rule.kind === 'lessons';
  if (rule.req === 'required') return true;
  if (rule.req === 'fromYear') return n >= (rule.fromYear || 1);
  return false;
}
function reqTag(rule) {
  if (rule.req === 'required') return '<span class="tag req">規定</span>';
  if (rule.req === 'fromYear') return `<span class="tag yr">第${rule.fromYear}年起規定</span>`;
  return '<span class="tag opt">選填</span>';
}
const activeRules = () => (DB.rules || []).filter(r => r.enabled);
// 統計欄名：聚集欄顯示「聚集」，其餘用簡稱
const colName = r => r.kind === 'gathering' ? '聚集' : (r.label || r.name);
const youthList = () => Object.values(DB.youths || {});
const byName = (a, b) => (a.name || '').localeCompare(b.name || '', 'zh-Hant');
const sortedYouths = () => youthList().sort(byName);
const findY = id => DB.youths[id];
const lessonDone = (y, rule) => rule.lessons.filter((_, i) => (y.lessons || {})[i]).length;

// 評估某規定：{ met, na, text }
function evalRule(rule, y, ym) {
  const n = yearN(y, ym);
  if (rule.kind === 'lessons') { const d = lessonDone(y, rule), t = rule.lessons.length; return { met: d >= t, text: `${d}/${t}` }; }
  if (!n) return { na: true, met: false, text: '—' };
  const m = (y.monthly || {})[ym] || {};
  const yv = ((y.yearly || {})['Y' + n] || {})[rule.id];
  switch (rule.kind) {
    case 'check': { const v = rule.period === 'once' ? !!(y.once || {})[rule.id] : !!m[rule.id]; return { met: v, text: v ? '✓' : '✗' }; }
    case 'gathering': {
      // 前兩年小排或主日皆可；第 N 年起必須是主日
      const sundayOnly = n >= (rule.sundayFromYear || 3);
      const v = sundayOnly ? (m.sunday || 0) > 0 : !!m.group || (m.sunday || 0) > 0;
      return { met: v, text: v ? '✓' : '✗' };
    }
    case 'count': if (rule.period === 'yearly') { const c = yv || 0; return { met: c >= rule.target, text: `${c}/${rule.target}` }; }
                  { const c = m[rule.id] || 0; return { met: c >= (rule.target || 1), text: `${c}次` }; }
    case 'hours': { const h = yv || 0; return { met: h >= rule.target, text: `${h}/${rule.target}h` }; }
  }
  return { met: false, text: '' };
}
// 本月達標：看八堂課與每月的規定項目；每年項目為年度進度，不影響本月達標
function monthStatus(y, ym) {
  const fail = [];
  for (const r of activeRules()) {
    if (r.period === 'yearly' || !isRequired(r, y, ym)) continue;
    if (!evalRule(r, y, ym).met) fail.push(colName(r));
  }
  return { ok: fail.length === 0, fail };
}

/* ============ 畫面 ============ */
let tab = 'att';
let curYm = thisMonth;
let attMode = 'monthly';
let needRender = false;
const app = document.getElementById('app');
const dlg = document.getElementById('dlg');

function updateHeader() {
  const sub = document.getElementById('hdrSub');
  if (!S) { sub.textContent = '請選擇召會'; return; }
  const sync = online ? (pending.length ? '同步中…' : '已同步') : `離線${pending.length ? `（${pending.length} 筆待上傳）` : ''}`;
  sub.textContent = `${S.name}・得少 ${youthList().length} 位・${sync}`;
}
// 其他服事者的修改進來時，若正在輸入就等輸入完再更新畫面
function scheduleRender() {
  const a = document.activeElement;
  const typing = a && (app.contains(a) || dlg.contains(a)) && /INPUT|TEXTAREA|SELECT/.test(a.tagName) && a.type !== 'checkbox';
  if (dlg.open || typing) { needRender = true; updateHeader(); return; }
  render();
}
app.addEventListener('focusout', () => { if (needRender) setTimeout(() => { if (needRender) scheduleRender(); }, 0); });
dlg.addEventListener('close', () => { if (needRender) scheduleRender(); });

function render() {
  needRender = false;
  document.body.classList.toggle('noauth', !S);
  updateHeader();
  if (!S) return renderLogin();
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  ({ rules: renderRules, youth: renderYouth, att: renderAtt, stats: renderStats })[tab]();
}

/* ---------- 登入：選擇召會 ---------- */
async function renderLogin() {
  app.innerHTML = `<div class="card"><h3>選擇你的召會</h3><div id="clist" class="empty">載入中…</div></div>
    <button class="btn ghost" data-act="newChurch">＋ 新增我的召會</button>`;
  try {
    const list = await api('');
    const el = document.getElementById('clist'); if (!el) return;
    el.className = '';
    el.innerHTML = list.length
      ? list.map(c => `<button class="church" data-act="pickChurch" data-id="${esc(c.id)}" data-name="${esc(c.name)}">${esc(c.name)}</button>`).join('')
      : '<div class="empty">還沒有召會，請按下方「新增我的召會」</div>';
  } catch (e) {
    const el = document.getElementById('clist'); if (el) el.textContent = '無法連線，請確認網路後重新整理';
  }
}
function loginDialog(id, name) {
  dlg.innerHTML = `<form><h3>${esc(name)}</h3>
    <label class="f"><span>密碼</span><input name="pw" type="password" inputmode="numeric" autocomplete="current-password" required></label>
    <div class="err" id="lerr"></div>
    <div class="row" style="justify-content:flex-end"><button type="button" class="btn ghost" id="cancel">取消</button><button class="btn">進入</button></div></form>`;
  const f = dlg.querySelector('form');
  dlg.querySelector('#cancel').onclick = () => dlg.close();
  f.onsubmit = async e => {
    e.preventDefault();
    const btn = f.querySelector('button.btn:not(.ghost)'); btn.disabled = true;
    try { const r = await api(`/${id}/login`, { password: f.pw.value }); dlg.close(); startSession(r); }
    catch (err) { dlg.querySelector('#lerr').textContent = err.message; btn.disabled = false; }
  };
  dlg.showModal(); f.pw.focus();
}
function newChurchDialog() {
  dlg.innerHTML = `<form><h3>新增我的召會</h3>
    <label class="f"><span>召會名稱</span><input name="name" maxlength="30" required placeholder="例：台北市召會"></label>
    <p class="muted" style="margin-top:0">建立後預設密碼為 <b>0000</b>，請到「① 各地規定」修改，再告訴其他服事者。</p>
    <div class="err" id="lerr"></div>
    <div class="row" style="justify-content:flex-end"><button type="button" class="btn ghost" id="cancel">取消</button><button class="btn">建立</button></div></form>`;
  const f = dlg.querySelector('form');
  dlg.querySelector('#cancel').onclick = () => dlg.close();
  f.onsubmit = async e => {
    e.preventDefault();

function drawStatsImage() {
  const { cols, rows } = statsData();
  const W = 1080, pad = 40, rowH = 58, headH = 210, thH = 56, footH = 90;
  const H = headH + thH + Math.max(rows.length, 1) * rowH + footH;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const g = cv.getContext('2d');
  const font = (s, w = 400) => `${w} ${s}px "PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif`;
  g.fillStyle = '#f3f6fa'; g.fillRect(0, 0, W, H);
  g.fillStyle = '#1f5aa6'; g.fillRect(0, 0, W, 150);
  g.fillStyle = '#fff'; g.font = font(44, 700); g.textBaseline = 'middle';
  g.fillText('得榮少年點名統計', pad, 58);
  g.font = font(28); g.fillText(`${S.name}　${ymLabel(curYm)}`, pad, 110);
  const ok = rows.filter(r => r.st.ok).length;
  g.fillStyle = '#1f2522'; g.font = font(28, 700);
  g.fillText(`共 ${rows.length} 位　`, pad, 182);
  let x0 = pad + g.measureText(`共 ${rows.length} 位　`).width;
  g.fillStyle = '#2e7d4f'; g.fillText(`達標 ${ok}　`, x0, 182); x0 += g.measureText(`達標 ${ok}　`).width;
  g.fillStyle = '#b3422f'; g.fillText(`未達 ${rows.length - ok}`, x0, 182);

  const nameW = 170, yrW = 60, stW = 110;
  const restW = (W - pad * 2 - nameW - yrW - stW) / Math.max(cols.length, 1);
  const xs = [pad, pad + nameW]; for (let i = 0; i < cols.length; i++) xs.push(pad + nameW + yrW + restW * i);
  const stX = pad + nameW + yrW + restW * cols.length;
  let y = headH;
  g.fillStyle = '#e3edf9'; g.fillRect(pad - 10, y, W - pad * 2 + 20, thH);
  g.fillStyle = '#1f5aa6'; g.font = font(22, 700);
  const center = (t, x, w, yy) => { g.textAlign = 'center'; g.fillText(t, x + w / 2, yy); g.textAlign = 'left'; };
  const fit = (t, w) => { let s = t; while (g.measureText(s).width > w - 8 && s.length > 1) s = s.slice(0, -1); return s; };
  g.fillText('姓名', pad, y + thH / 2);
  center('年', pad + nameW, yrW, y + thH / 2);
  cols.forEach((c, i) => center(fit(colName(c), restW), xs[i + 2], restW, y + thH / 2));
  center('本月', stX, stW, y + thH / 2);
  y += thH;
  rows.forEach((r, ri) => {
    if (ri % 2) { g.fillStyle = '#ffffff'; g.fillRect(pad - 10, y, W - pad * 2 + 20, rowH); }
    g.font = font(26, 600); g.fillStyle = '#1f2522';
    g.fillText(fit(r.y.name, nameW), pad, y + rowH / 2);
    g.font = font(24); center(r.n ? String(r.n) : '待', pad + nameW, yrW, y + rowH / 2);
    r.cells.forEach((c, i) => {
      const cls = cellCls(c);
      g.fillStyle = cls === 'y' ? '#2e7d4f' : cls === 'n' ? '#b3422f' : '#8a908c';
      g.font = font(24, c.met ? 700 : 400);
      center(c.text, xs[i + 2], restW, y + rowH / 2);
    });
    g.fillStyle = r.st.ok ? '#2e7d4f' : '#b3422f'; g.font = font(24, 700);
    center(r.st.ok ? '達標' : '未達', stX, stW, y + rowH / 2);
    y += rowH;
  });
  if (!rows.length) { g.fillStyle = '#6b726e'; g.font = font(24); center('尚未新增得少', 0, W, y + rowH / 2); y += rowH; }
  g.fillStyle = '#6b726e'; g.font = font(20);
  g.fillText('✓ 完成　✗ 未完成　待：待申請（只需八堂課）　灰色：選填或年度累計中', pad, y + 40);
  return cv;
}

async function shareImg() {
  const cv = drawStatsImage();
  const url = cv.toDataURL('image/png');
  document.getElementById('preview').innerHTML = `<img src="${url}" alt="統計圖片"><p class="muted">若無法直接分享，可長按圖片儲存。</p>`;
  const blob = await new Promise(r => cv.toBlob(r, 'image/png'));
  const file = new File([blob], `得少點名_${curYm}.png`, { type: 'image/png' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file], title: `得榮少年點名 ${ymLabel(curYm)}` }); } catch (e) {}
  } else {
    const a = document.createElement('a'); a.href = url; a.download = file.name; a.click();
  }
}

function copyText() {
  const { cols, rows } = statsData();
  const ok = rows.filter(r => r.st.ok).length;
  const lines = [`【得榮少年點名】${S.name} ${ymLabel(curYm)}`, `共 ${rows.length} 位，達標 ${ok}，未達 ${rows.length - ok}`, ''];
  rows.forEach(r => lines.push(`${r.st.ok ? '✅' : '⭕'} ${r.y.name}（${r.n ? `第${r.n}年` : '待申請'}）` +
    cols.map((c, i) => r.cells[i].na ? '' : ` ${colName(c)}${r.cells[i].text}`).join('')));
  const t = lines.join('\n');
  (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast('已複製'), () => prompt('請複製以下文字', t));
}

/* ---------- 備份 ---------- */
function exportData() {
  const blob = new Blob([JSON.stringify(DB, null, 2)], { type: 'application/json' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `得少點名備份_${S.name}_${new Date().toISOString().slice(0, 10)}.json`; a.click();
}
function importData(e) {
  const file = e.target.files[0]; if (!file) return;
  file.text().then(t => {
    const d = JSON.parse(t);
    if (!Array.isArray(d.rules) || typeof d.youths !== 'object') throw 0;
    const n = Object.keys(d.youths).length;
    if (!confirm(`匯入將覆蓋「${S.name}」所有服事者看到的資料（得少 ${n} 位），確定？`)) return;
    setPath(['rules'], d.rules); setPath(['youths'], d.youths); render(); toast('匯入完成');
  }).catch(() => toast('檔案格式錯誤'));
}

function toast(msg) {
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2000);
}

/* ============ 事件 ============ */
document.getElementById('nav').onclick = e => { const b = e.target.closest('button'); if (b) { tab = b.dataset.tab; render(); window.scrollTo(0, 0); } };
app.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act;
  if (a === 'pickChurch') loginDialog(el.dataset.id, el.dataset.name);
  else if (a === 'newChurch') newChurchDialog();
  else if (a === 'password') passwordDialog();
  else if (a === 'logout') {
    if (pending.length && !confirm(`還有 ${pending.length} 筆修改沒上傳，登出會遺失，確定？`)) return;
    if (confirm('登出後需要密碼才能再進入，確定？')) logout();
  }
  else if (a === 'addRule') ruleDialog();
  else if (a === 'editRule') ruleDialog(DB.rules.find(r => r.id === el.dataset.id));
  else if (a === 'addYouth') youthDialog();
  else if (a === 'editYouth') youthDialog(findY(el.dataset.id));
  else if (a === 'export') exportData();
  else if (a === 'import') document.getElementById('importFile').click();
  else if (a === 'attMode') { attMode = el.dataset.v; render(); }
  else if (a === 'prevM' || a === 'nextM') { curYm = shiftYm(curYm, a === 'prevM' ? -1 : 1); render(); }
  else if (a === 'step') {
    const y = findY(el.dataset.y), k = el.dataset.k;
    const cur = (((y.monthly || {})[curYm]) || {})[k] || 0;
    setPath(['youths', y.id, 'monthly', curYm, k], Math.max(0, Math.min(5, cur + +el.dataset.d))); render();
  }
  else if (a === 'shareImg') shareImg();
  else if (a === 'copyText') copyText();
});
app.addEventListener('change', e => {
  const el = e.target; const a = el.dataset.act; if (!a) return;
  const id = el.dataset.y;
  if (a === 'mcheck') setPath(['youths', id, 'monthly', curYm, el.dataset.k], el.checked);
  else if (a === 'ocheck') setPath(['youths', id, 'once', el.dataset.k], el.checked);
  else if (a === 'lesson') setPath(['youths', id, 'lessons', el.dataset.i], el.checked);
  else if (a === 'yval') setPath(['youths', id, 'yearly', 'Y' + el.dataset.n, el.dataset.k], Math.max(0, +el.value || 0));
  else return;
  render();
});

if (S) startSession(S); else render();
if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
